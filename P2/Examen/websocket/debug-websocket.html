<!DOCTYPE html>
<html>
<head>
    <title>Debug WebSocket Coberturas</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; background: #f9f9f9; }
        button { margin: 5px; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔍 Debug WebSocket Coberturas</h1>
    
    <div>
        <button onclick="connectSocket()">🔗 Conectar</button>
        <button onclick="testFindAll()">📋 Test FindAll</button>
        <button onclick="testCreate()">➕ Test Create</button>
        <button onclick="testCreateCristales()">🏗️ Crear Cristales</button>
        <button onclick="testCreateRobo()">🚗 Crear Contra Robo</button>
        <button onclick="clearLog()">🗑️ Limpiar Log</button>
        <span id="status">❌ Desconectado</span>
    </div>

    <div class="log" id="log"></div>

    <script>
        let socket = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function connectSocket() {
            if (socket) {
                socket.disconnect();
            }

            log('🔗 Intentando conectar a ws://localhost:3002/coberturas...', 'info');
            
            socket = io('http://localhost:3002/coberturas', {
                transports: ['websocket'],
                timeout: 10000
            });

            socket.on('connect', () => {
                document.getElementById('status').textContent = '✅ Conectado';
                log('✅ Conectado exitosamente!', 'success');
                log(`📍 Socket ID: ${socket.id}`, 'info');
            });

            socket.on('disconnect', (reason) => {
                document.getElementById('status').textContent = '❌ Desconectado';
                log(`❌ Desconectado: ${reason}`, 'error');
            });

            socket.on('connect_error', (error) => {
                log(`❌ Error de conexión: ${error.message}`, 'error');
            });

            // Escuchar evento de bienvenida
            socket.on('coberturas:connected', (data) => {
                log(`🎉 Bienvenida: ${JSON.stringify(data)}`, 'success');
            });

            // Escuchar errores
            socket.on('coberturas:error', (error) => {
                log(`❌ Error del servidor: ${JSON.stringify(error)}`, 'error');
            });

            // Escuchar TODAS las respuestas
            socket.onAny((event, data) => {
                log(`📥 Evento recibido: ${event}`, 'info');
                log(`📦 Datos: ${JSON.stringify(data, null, 2)}`, 'info');
            });
        }

        function testFindAll() {
            if (!socket || !socket.connected) {
                log('❌ No hay conexión WebSocket', 'error');
                return;
            }

            log('📤 Enviando coberturas:findAll...', 'info');
            
            // Método 1: Con callback
            socket.emit('coberturas:findAll', {}, (response) => {
                log('📥 Respuesta con callback:', 'success');
                log(`📦 ${JSON.stringify(response, null, 2)}`, 'success');
            });

            // Método 2: Sin callback (esperar evento)
            setTimeout(() => {
                socket.emit('coberturas:findAll', {});
                log('📤 Enviado sin callback, esperando respuesta...', 'info');
            }, 1000);
        }

        function testCreate() {
            if (!socket || !socket.connected) {
                log('❌ No hay conexión WebSocket', 'error');
                return;
            }

            const testData = {
                tipo: 'total',
                seguro: 'todo riesgo',
                deducible: 500.00
            };

            log('📤 Enviando coberturas:create...', 'info');
            log(`📦 Datos: ${JSON.stringify(testData, null, 2)}`, 'info');
            
            socket.emit('coberturas:create', testData, (response) => {
                log('📥 Respuesta create:', 'success');
                log(`📦 ${JSON.stringify(response, null, 2)}`, 'success');
                
                // Después de crear, intentar obtener todas
                setTimeout(() => {
                    testFindAll();
                }, 500);
            });
        }

        function testCreateCristales() {
            if (!socket || !socket.connected) {
                log('❌ No hay conexión WebSocket', 'error');
                return;
            }

            const testData = {
                tipo: 'cristales',
                seguro: 'cristales',
                deducible: 150.00
            };

            log('📤 Enviando coberturas:create (cristales)...', 'info');
            log(`📦 Datos: ${JSON.stringify(testData, null, 2)}`, 'info');
            
            socket.emit('coberturas:create', testData, (response) => {
                log('📥 Respuesta create:', 'success');
                log(`📦 ${JSON.stringify(response, null, 2)}`, 'success');
                
                setTimeout(() => testFindAll(), 500);
            });
        }

        function testCreateRobo() {
            if (!socket || !socket.connected) {
                log('❌ No hay conexión WebSocket', 'error');
                return;
            }

            const testData = {
                tipo: 'contra robo',
                seguro: 'robo y hurto',
                deducible: 300.00
            };

            log('📤 Enviando coberturas:create (contra robo)...', 'info');
            log(`📦 Datos: ${JSON.stringify(testData, null, 2)}`, 'info');
            
            socket.emit('coberturas:create', testData, (response) => {
                log('📥 Respuesta create:', 'success');
                log(`📦 ${JSON.stringify(response, null, 2)}`, 'success');
                
                setTimeout(() => testFindAll(), 500);
            });
        }

        // Auto-conectar al cargar la página
        window.onload = () => {
            log('🚀 Página cargada, lista para testing', 'info');
        };
    </script>
</body>
</html>
